# Used only by the SHA-bound pending LAN recovery after proven address loss.
# Preserve the prior LAN identity internally, without its unavailable host sockets.
services:
  proxy:
    ports: !override
      - "127.0.0.1:80:80/tcp"
      - "127.0.0.1:443:443/tcp"
      - "${PROXY_LAN_IP}:443:443/tcp"
      - "${PROXY_LAN_IP}:8443:8443/tcp"
