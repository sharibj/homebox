server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    include /etc/nginx/mime.types;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    add_header Cache-Control "no-cache" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' blob: data:; connect-src 'self'; font-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;
    location = /healthz { access_log off; return 200 "ok\n"; }
    # The edge proxy owns API routing. Never return an HTML success for API failures.
    location /api/ { return 404; }
    location = /sw.js { add_header Cache-Control "no-store"; }
    location / {
        try_files $uri $uri/ /index.html;
    }
}
